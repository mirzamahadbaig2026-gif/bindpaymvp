            selectedTxId: null,
            filterStatus: 'all',
            searchQuery: '',
            modalState: null,
            mobileMenuOpen: false

        function saveState() {
            localStorage.setItem('bindpay_user', JSON.stringify(state.currentUser));
            localStorage.setItem('bindpay_lang', state.lang);
            localStorage.setItem('bindpay_theme', state.theme);
            localStorage.setItem('bindpay_txs', JSON.stringify(state.transactions));
            localStorage.setItem('bindpay_users', JSON.stringify(state.users));
            localStorage.setItem('bindpay_notifs', JSON.stringify(state.notifications));
        }

        function t(key) {
            return i18n[state.lang][key] || key;
        }

        function formatPKR(amount) {
            return "Rs. " + Number(amount).toLocaleString('en-PK');
        }

        function addNotification(text) {
            state.notifications.unshift({
                id: Date.now(),
                text: text,
                time: "Just now",
                read: false
            });
            saveState();
        }

        function resetDemoData() {
            state.transactions = JSON.parse(JSON.stringify(initialTransactions));
            state.users = JSON.parse(JSON.stringify(initialUsers));
            state.notifications = JSON.parse(JSON.stringify(initialNotifications));
            state.currentUser = null;
            saveState();
            render();
            showToast("Demo environment reset to initial test state!", "success");

        // ==========================================
        // 5. TOAST NOTIFICATION SYSTEM
        // ==========================================
        function showToast(message, type = 'success') {
            const existing = document.getElementById('toast-container');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.id = 'toast-container';
            toast.className = `fixed bottom-4 right-4 left-4 sm:left-auto z-50 px-4 py-3 rounded-xl shadow-2xl flex items-center space-x-3 text-xs sm:text-sm font-medium transition-all duration-300 ${
                type === 'success' ? 'bg-acidlime text-obsidian border border-lime-400' : 'bg-hotorange text-offwhite'
            }`;
            toast.innerHTML = `
                <i data-lucide="${type === 'success' ? 'check-circle-2' : 'alert-circle'}" class="w-4 h-4 flex-shrink-0"></i>
                <span class="flex-1">${message}</span>
            `;
            document.body.appendChild(toast);
            lucide.createIcons();
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // ==========================================
        // 6. RENDER ENGINE & ROUTING
        // ==========================================
        function render() {
            const app = document.getElementById('app');
            const htmlTag = document.documentElement;

            if (state.theme === 'dark') {
                htmlTag.classList.add('dark');
                htmlTag.classList.remove('light');
            } else {
                htmlTag.classList.remove('dark');
                htmlTag.classList.add('light');
            }

            if (state.lang === 'ur') {
                htmlTag.setAttribute('dir', 'rtl');
                htmlTag.classList.add('urdu-font');
            } else {
                htmlTag.setAttribute('dir', 'ltr');
                htmlTag.classList.remove('urdu-font');
            }

            if (!state.currentUser) {
                app.innerHTML = renderAuthScreen();
            } else {
                app.innerHTML = renderDashboardContainer();
            }

            lucide.createIcons();
        }

        function fillLogin(email, pass) {
            document.getElementById('authEmail').value = email;
            document.getElementById('authPassword').value = pass;
        }

        function handleAuthSubmit(event) {
            event.preventDefault();
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value.trim();

            if (state.modalState === 'register') {
                const name = document.getElementById('regName').value.trim();
                const role = document.getElementById('regRole').value;
                if (state.users.some(u => u.email === email)) {
                    showToast("User account with this email already exists!", "error");
                    return;
                }
                const newUser = { email, password, name, role };
                state.users.push(newUser);
                state.currentUser = newUser;
                state.modalState = null;
                saveState();
                render();
                showToast(`Welcome to BindPay, ${name}! Account created successfully.`);
            } else {
                const user = state.users.find(u => u.email === email && u.password === password);
                if (user) {
                    state.currentUser = user;
                    saveState();
                    render();
                    showToast(`Logged in successfully as ${user.name}`);
                } else {
                    showToast("Invalid email or password. Try demo accounts.", "error");
                }
            }
        }

        // --- OVERVIEW TAB ---
        function renderOverviewTab() {
            const role = state.currentUser.role;
            const myTxs = state.transactions.filter(tx => role === 'seller' ? tx.sellerEmail === state.currentUser.email : tx.buyerEmail === state.currentUser.email);

            const totalDeals = myTxs.length;
            const activeDeals = myTxs.filter(tx => ['Accepted', 'Payment Received', 'Shipped / Dispatched'].includes(tx.status)).length;
            const completedDeals = myTxs.filter(tx => tx.status === 'Completed').length;
            const pendingDeals = myTxs.filter(tx => tx.status === 'Proposed').length;

            let totalEarnings = 0;
            let availableEarnings = 0;
            let earningsOnHold = 0;
            let disputedAmount = 0;
            let paymentsMade = 0;
            let paymentsOnHold = 0;

            myTxs.forEach(tx => {
                if (role === 'seller') {
                    if (tx.status === 'Completed') {
                        totalEarnings += tx.amount;
                        availableEarnings += tx.amount;
                    }
                    if (['Payment Received', 'Shipped / Dispatched'].includes(tx.status)) earningsOnHold += tx.amount;
                    if (tx.status === 'Disputed') disputedAmount += tx.amount;
                } else {
                    if (['Payment Received', 'Shipped / Dispatched', 'Completed'].includes(tx.status)) paymentsMade += tx.amount;
                    if (['Payment Received', 'Shipped / Dispatched'].includes(tx.status)) paymentsOnHold += tx.amount;
                    if (tx.status === 'Disputed') disputedAmount += tx.amount;
                }
            });

            return `
                <div class="space-y-6 w-full">
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-6">
                        <div class="p-5 sm:p-6 rounded-2xl bg-carddark dark:bg-carddark bg-white border border-borderdark dark:border-borderdark border-borderlight shadow-lg">

                                <i data-lucide="briefcase" class="w-5 h-5 text-acidlime"></i>
                            </div>
                            <div class="text-2xl sm:text-3xl font-extrabold">${totalDeals}</div>
                            <div class="mt-2 text-xs text-softgray">${pendingDeals} Proposed, ${activeDeals} Active</div>
                        </div>

                        <div class="p-5 sm:p-6 rounded-2xl bg-carddark dark:bg-carddark bg-white border border-borderdark dark:border-borderdark border-borderlight shadow-lg">
                            <div class="flex items-center justify-between text-softgray mb-3">
                                <span class="text-xs uppercase font-semibold">${role === 'seller' ? t('totalEarnings') : 'Payments Made'}</span>
                                <i data-lucide="wallet" class="w-5 h-5 text-electricpurple"></i>
                            </div>
                            <div class="text-2xl sm:text-3xl font-extrabold">${formatPKR(role === 'seller' ? totalEarnings : paymentsMade)}</div>
                            <div class="mt-2 text-xs text-softgray">Secure Escrow Settlement</div>
                        </div>

                        <div class="p-5 sm:p-6 rounded-2xl bg-carddark dark:bg-carddark bg-white border border-borderdark dark:border-borderdark border-borderlight shadow-lg">
                            <div class="flex items-center justify-between text-softgray mb-3">
                                <span class="text-xs uppercase font-semibold">${role === 'seller' ? t('earningsOnHold') : 'Payments on Hold'}</span>
                                <i data-lucide="lock" class="w-5 h-5 text-hotorange"></i>
                            </div>
                            <div class="text-2xl sm:text-3xl font-extrabold">${formatPKR(role === 'seller' ? earningsOnHold : paymentsOnHold)}</div>
                            <div class="mt-2 text-xs text-softgray">Protected in Escrow Vault</div>
                        </div>

                        <div class="p-5 sm:p-6 rounded-2xl bg-carddark dark:bg-carddark bg-white border border-borderdark dark:border-borderdark border-borderlight shadow-lg">
                            <div class="flex items-center justify-between text-softgray mb-3">
                                <span class="text-xs uppercase font-semibold">${t('disputedAmount')}</span>
                                <i data-lucide="alert-triangle" class="w-5 h-5 text-red-400"></i>
                            </div>
                            <div class="text-2xl sm:text-3xl font-extrabold">${formatPKR(disputedAmount)}</div>
                            <div class="mt-2 text-xs text-softgray">Under Mediation Review</div>
                        </div>
                    </div>

                    <div class="bg-carddark dark:bg-carddark bg-white border border-borderdark dark:border-borderdark border-borderlight rounded-2xl p-5 sm:p-6 shadow-lg">
                        <div class="flex items-center justify-between mb-4">

                        <div class="overflow-x-auto w-full">

                                        <th class="pb-3 pr-4">${role === 'seller' ? 'Buyer' : 'Seller'}</th>
                                        <th class="pb-3 pr-4">${t('amount')}</th>
                                        <th class="pb-3 pr-4">${t('status')}</th>
                                        <th class="pb-3 text-right">${t('action')}</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-borderdark">
                                    ${myTxs.slice(0, 5).map(tx => `

                                            <td class="py-4 pr-4 font-bold">${formatPKR(tx.amount)}</td>
                                            <td class="py-4 pr-4">

                                            </td>
                                        </tr>
                                    `).join('')}
                                    ${myTxs.length === 0 ? `<tr><td colspan="6" class="text-center py-8 text-softgray">No transactions found.</td></tr>` : ''}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function getStatusBadgeClass(status) {
            switch(status) {
                case 'Completed': return 'bg-acidlime/10 text-acidlime border border-acidlime/20';
                case 'Payment Received': return 'bg-electricpurple/10 text-electricpurple border border-electricpurple/20';
                case 'Shipped / Dispatched': return 'bg-blue-500/10 text-blue-400 border border-blue-500/20';
                case 'Disputed': return 'bg-red-500/10 text-red-400 border border-red-500/20';
                case 'Rejected': return 'bg-zinc-700 text-softgray';
                case 'Proposed': return 'bg-hotorange/10 text-hotorange border border-hotorange/20';

            }
        }

        function handleCreateDeal(event) {
            event.preventDefault();
            const newTx = {
                id: document.getElementById('newTxId').value,
                title: document.getElementById('newTitle').value,
                sellerEmail: document.getElementById('newSellerEmail').value.trim(),
                sellerName: document.getElementById('newSellerName').value,
                buyerEmail: state.currentUser.email,
                buyerName: state.currentUser.name,
                amount: Number(document.getElementById('newAmount').value),
                deliveryMethod: document.getElementById('newDeliveryMethod').value,
                expectedDate: document.getElementById('newDate').value || "2026-03-30",
                terms: document.getElementById('newTerms').value,
                notes: "Proposed by buyer via BindPay secure portal.",
                status: "Proposed",
                shippingStage: "Preparing Order",
                createdAt: new Date().toISOString().replace('T', ' ').substring(0, 16),
                paymentRef: null,
                paymentMethod: null,
                timeline: [
                    { time: new Date().toISOString().replace('T', ' ').substring(0, 16), event: `Deal proposal created by buyer ${state.currentUser.name} and sent to seller.` }
                ],
                dispute: null
            };

            state.transactions.unshift(newTx);

        function resolveDispute(txId, favour) {
            const tx = state.transactions.find(t => t.id === txId);
            if (!tx) return;
            tx.status = favour === 'buyer' ? 'Rejected' : 'Completed';
            tx.shippingStage = favour === 'buyer' ? 'Preparing Order' : 'Delivered';
            tx.dispute = null;
            tx.timeline.push({
                time: new Date().toISOString().replace('T', ' ').substring(0, 16),
                event: `Admin resolved dispute in favour of ${favour.toUpperCase()}. Status updated to ${tx.status}.`
            });
            addNotification(`Dispute for ${txId} resolved by admin in favour of ${favour}.`);
            saveState();
            render();
            showToast(`Transaction ${txId} successfully resolved!`);
        }

        function acceptDeal(txId) {
            const tx = state.transactions.find(t => t.id === txId);
            if (!tx) return;
            tx.status = 'Accepted';
            tx.timeline.push({ time: new Date().toISOString().replace('T', ' ').substring(0, 16), event: `Deal proposal accepted by seller ${state.currentUser.name}. Awaiting buyer payment.` });
            addNotification(`Deal ${txId} accepted by seller.`);
            saveState();
            closeModal();
            render();
            showToast("Deal proposal accepted successfully!");
        }

        function rejectDeal(txId) {
            const tx = state.transactions.find(t => t.id === txId);
            if (!tx) return;
            tx.status = 'Rejected';
            tx.timeline.push({ time: new Date().toISOString().replace('T', ' ').substring(0, 16), event: `Deal proposal rejected by seller ${state.currentUser.name}.` });
            addNotification(`Deal ${txId} rejected by seller.`);
            saveState();
            closeModal();
            render();
            showToast("Deal proposal rejected.", "error");
        }

        function openPaymentScreen(txId) {
            const tx = state.transactions.find(t => t.id === txId);
            if (!tx) return;
            closeModal();

            const modalEl = document.createElement('div');
            modalEl.id = 'global-modal';
            modalEl.className = 'fixed inset-0 z-50 flex items-center justify-center p-4 bg-obsidian/80 backdrop-blur-sm w-full';
            modalEl.innerHTML = `
                <div class="w-full max-w-lg bg-carddark dark:bg-carddark bg-white border border-borderdark dark:border-borderdark border-borderlight rounded-2xl p-6 shadow-2xl space-y-5">
                    <div class="flex justify-between items-center border-b border-borderdark pb-4">
                        <h3 class="text-base sm:text-lg font-bold">Simulated Secure Payment Gateway</h3>
                        <button onclick="closeModal()" class="p-2 rounded-xl bg-zinc-800 text-softgray hover:text-offwhite"><i data-lucide="x" class="w-5 h-5"></i></button>
                    </div>
                    <div class="space-y-4 text-sm">
                        <div class="p-4 rounded-xl bg-obsidian border border-borderdark space-y-1">
                            <div class="text-xs text-softgray">Amount to Secure in Escrow</div>
                            <div class="text-xl sm:text-2xl font-extrabold text-acidlime">${formatPKR(tx.amount)}</div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase text-softgray mb-2">Select Payment Simulation Method</label>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <label class="p-3 rounded-xl bg-obsidian border border-borderdark flex items-center space-x-3 cursor-pointer hover:border-acidlime">
                                    <input type="radio" name="payMethod" value="Bank Transfer (Meezan Bank)" checked class="text-acidlime">
                                    <span>Bank Transfer</span>
                                </label>
                                <label class="p-3 rounded-xl bg-obsidian border border-borderdark flex items-center space-x-3 cursor-pointer hover:border-acidlime">
                                    <input type="radio" name="payMethod" value="JazzCash Wallet" class="text-acidlime">
                                    <span>JazzCash</span>
                                </label>
                                <label class="p-3 rounded-xl bg-obsidian border border-borderdark flex items-center space-x-3 cursor-pointer hover:border-acidlime">
                                    <input type="radio" name="payMethod" value="Easypaisa Wallet" class="text-acidlime">
                                    <span>Easypaisa</span>
                                </label>
                                <label class="p-3 rounded-xl bg-obsidian border border-borderdark flex items-center space-x-3 cursor-pointer hover:border-acidlime">
                                    <input type="radio" name="payMethod" value="BindPay Demo Balance" class="text-acidlime">
                                    <span>BindPay Balance</span>
                                </label>
                            </div>
                        </div>
                        <button onclick="processPayment('${tx.id}')" class="w-full py-4 px-4 bg-acidlime text-obsidian font-extrabold rounded-xl hover:bg-lime-400 transition-colors shadow-lg shadow-acidlime/20 text-sm">
                            PAY NOW (${formatPKR(tx.amount)})
                        </button>
                    </div>
                </div>
            `;
            document.body.appendChild(modalEl);
            lucide.createIcons();
        }

        function processPayment(txId) {
            const tx = state.transactions.find(t => t.id === txId);
            if (!tx) return;
            const method = document.querySelector('input[name="payMethod"]:checked').value;
            const payRef = "PAY-PK-" + Math.floor(100000 + Math.random() * 900000);

            tx.status = 'Payment Received';
            tx.paymentMethod = method;
            tx.paymentRef = payRef;
            tx.timeline.push({
                time: new Date().toISOString().replace('T', ' ').substring(0, 16),
                event: `Simulated payment of ${formatPKR(tx.amount)} via ${method} received (Ref: ${payRef}) and secured in escrow vault.`
            });

            addNotification(`Payment received for deal ${txId}. Funds secured in escrow.`);
            saveState();
            closeModal();
            render();
            showToast("Payment successfully processed and secured in escrow!");
        }

        function updateDeliveryStage(txId) {
            const tx = state.transactions.find(t => t.id === txId);
            if (!tx) return;
            const stage = document.getElementById('updateStageSelect').value;
            tx.shippingStage = stage;
            if (stage === 'Delivered') {
                tx.status = 'Shipped / Dispatched';
            }
            tx.timeline.push({
                time: new Date().toISOString().replace('T', ' ').substring(0, 16),
                event: `Seller updated delivery progress to: ${stage}.`
            });

            addNotification(`Delivery progress updated for ${txId}: ${stage}`);
            saveState();
            closeModal();
            render();
            showToast(`Delivery stage updated to ${stage}!`);
        }

        function confirmDelivery(txId) {
            const tx = state.transactions.find(t => t.id === txId);
            if (!tx) return;
            tx.status = 'Completed';
            tx.shippingStage = 'Delivered';
            tx.timeline.push({
                time: new Date().toISOString().replace('T', ' ').substring(0, 16),
                event: `Delivery confirmed by buyer. Escrow funds released to seller available balance.`
            });

            addNotification(`Delivery confirmed for ${txId}. Funds released to seller.`);
            saveState();
            closeModal();
            render();
            showToast("Delivery confirmed successfully! Funds released to seller.");
        }

        function openDisputeForm(txId) {
            closeModal();
            const modalEl = document.createElement('div');
            modalEl.id = 'global-modal';
            modalEl.className = 'fixed inset-0 z-50 flex items-center justify-center p-4 bg-obsidian/80 backdrop-blur-sm w-full';
            modalEl.innerHTML = `
                <div class="w-full max-w-lg bg-carddark dark:bg-carddark bg-white border border-borderdark dark:border-borderdark border-borderlight rounded-2xl p-6 shadow-2xl space-y-5">
                    <div class="flex justify-between items-center border-b border-borderdark pb-4">
                        <h3 class="text-base sm:text-lg font-bold">Raise Escrow Dispute</h3>
                        <button onclick="closeModal()" class="p-2 rounded-xl bg-zinc-800 text-softgray hover:text-offwhite"><i data-lucide="x" class="w-5 h-5"></i></button>
                    </div>
                    <form onsubmit="submitDispute(event, '${txId}')" class="space-y-4 text-sm">
                        <div>
                            <label class="block text-xs font-semibold uppercase text-softgray mb-1.5">Dispute Reason</label>
                            <select id="disputeReason" class="w-full px-4 py-3 rounded-xl bg-obsidian border border-borderdark text-offwhite">
                                <option value="Product Not Received">Product Not Received</option>
                                <option value="Wrong Product Received">Wrong Product Received</option>
                                <option value="Damaged Product">Damaged Product</option>
                                <option value="Service Not Delivered">Service Not Delivered</option>
                                <option value="Terms Not Followed">Terms Not Followed</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase text-softgray mb-1.5">Detailed Description</label>
                            <textarea id="disputeDesc" rows="3" required placeholder="Describe the issue in detail..." class="w-full px-4 py-3 rounded-xl bg-obsidian border border-borderdark text-offwhite"></textarea>
                        </div>
                        <button type="submit" class="w-full py-3.5 px-4 bg-red-500 text-white font-bold rounded-xl hover:bg-red-600 shadow-lg">
                            Submit Dispute & Freeze Funds
                        </button>
                    </form>
                </div>
            `;
            document.body.appendChild(modalEl);
            lucide.createIcons();
        }

        function submitDispute(event, txId) {
            event.preventDefault();
            const tx = state.transactions.find(t => t.id === txId);
            if (!tx) return;
            const reason = document.getElementById('disputeReason').value;
            const desc = document.getElementById('disputeDesc').value;
            const dId = "DSP-" + Math.floor(1000 + Math.random() * 9000);

            tx.status = 'Disputed';
            tx.dispute = {
                id: dId,
                reason: reason,
                description: desc,
                notes: "Submitted via buyer portal.",
                date: new Date().toISOString().replace('T', ' ').substring(0, 16),
                status: "Open"
            };
            tx.timeline.push({
                time: new Date().toISOString().replace('T', ' ').substring(0, 16),
                event: `Dispute raised by buyer (${reason}). Escrow funds frozen.`
            });

            addNotification(`Dispute raised on transaction ${txId}. Escrow funds frozen.`);
            saveState();
            closeModal();
            render();
            showToast("Dispute successfully submitted. Escrow funds frozen for mediation.", "error");
        }

        window.onload = function() {
            render();
        };
    </script>
</body>
</html>
